workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "main"

stages:
  - build
  - test

variables:
  MAVEN_OPTS: "-Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository"
  MAVEN_CLI_OPTS: "--batch-mode --errors --fail-at-end --show-version"

cache:
  paths:
    - .m2/repository

build-job:
  stage: build
  image: eclipse-temurin:21-jdk
  script:
    - chmod +x mvnw
    - ./mvnw $MAVEN_CLI_OPTS clean compile test package
  artifacts:
    paths:
      - target/*.jar
    expire_in: 1 week

sast-semgrep:
  stage: test
  image: returntocorp/semgrep
  script:
    - semgrep ci --config auto --sarif --output report.sarif .
  artifacts:
    reports:
      sast: report.sarif
    paths:
      - report.sarif
    expire_in: 1 week
  allow_failure: true

sca-dependency-check:
  stage: test
  image: maven:3.9-eclipse-temurin-21
  script:
    - chmod +x mvnw
    - ./mvnw dependency-check:check -DskipTests
  artifacts:
    paths:
      - target/dependency-check-report.html
    expire_in: 1 week
  allow_failure: true